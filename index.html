<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>European megalith transport — flow map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #1b241c;
    --paper: #f4efe4;
    --panel: #fffdf8;
    --line: #c9bfa8;
    --accent: #8b3a2a;
    --teal: #2e5a4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--paper); }
  #map { position: absolute; inset: 0; }
  .overlay {
    position: absolute; z-index: 1000; top: 12px; left: 12px;
    width: min(400px, calc(100vw - 24px));
    max-height: calc(100vh - 24px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(30,24,16,.18); padding: 14px 16px 16px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { font-size: .82rem; color: #5a5348; margin: 0 0 10px; line-height: 1.35; }
  label { display: block; font-size: .78rem; margin: 8px 0 3px; color: #3d3830; }
  select, input[type=range], input[type=search] { width: 100%; font: inherit; }
  input[type=search] { padding: 4px 6px; border: 1px solid var(--line); background: #fff; }
  .swatch { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }
  .legend { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; font-size: .75rem; color: #4a453c; }
  .legend div { margin: 3px 0; display: flex; gap: 8px; align-items: center; }
  button {
    margin-top: 8px; margin-right: 6px; background: var(--teal); color: #fff; border: 0;
    padding: 6px 10px; cursor: pointer; font: inherit; font-size: .8rem;
  }
  button.secondary { background: #6b6356; }
  a { color: var(--teal); }
  .count { font-variant-numeric: tabular-nums; }
  .leaflet-popup-content { font-family: Georgia, serif; font-size: 13px; line-height: 1.4; min-width: 230px; }
  .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 14px; }
  .muted { color: #6a6358; }
  #gazetteer { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; max-height: 38vh; overflow: auto; }
  .g-item {
    display: grid; grid-template-columns: 52px 1fr; gap: 6px;
    padding: 6px 4px; cursor: pointer; border-bottom: 1px solid #efe8d8;
    font-size: .78rem; line-height: 1.3;
  }
  .g-item:hover, .g-item.active { background: #f3ead6; }
  .g-km { font-variant-numeric: tabular-nums; font-weight: 700; }
  .g-src { color: #5a5348; font-size: .72rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<aside class="overlay">
  <h1>Proven megalith hauls</h1>
  <p class="sub">Arrow <em>weight</em> scales with published distance. Click a line, point, or gazetteer row. v0.2 ·
    <a href="https://github.com/TimDaw37/european-megalith-transport">repo</a> ·
    <a href="gazetteer.html">full gazetteer</a></p>

  <label>Minimum distance shown: <span id="minLabel">0</span> km</label>
  <input type="range" id="minKm" min="0" max="200" step="1" value="0">

  <label>Region</label>
  <select id="region"><option value="all">All regions</option></select>

  <label>Evidence</label>
  <select id="evidence">
    <option value="all">High and medium</option>
    <option value="high">High only</option>
  </select>

  <label>Find in gazetteer</label>
  <input type="search" id="q" placeholder="Site, source, rock…">

  <div class="legend">
    <div><span class="swatch" style="background:#8b3a2a;height:8px"></span> ≥200 km</div>
    <div><span class="swatch" style="background:#c46b2c;height:5px"></span> 20–200 km</div>
    <div><span class="swatch" style="background:#2e5a4c;height:3px"></span> <20 km</div>
    <div>● monument &nbsp; ◆ source &nbsp; → direction of haul</div>
    <div class="count" id="stats"></div>
    <p class="muted" style="margin:8px 0 0">Schematic flows, not reconstructed routes. Sector centroids are approximate.</p>
  </div>
  <button type="button" id="fit">Fit visible</button>
  <button type="button" class="secondary" id="csv">Download CSV</button>
  <div id="gazetteer"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([48.2, -4], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let HAULS = [];
const byId = {};

function colour(km) {
  if (km >= 200) return '#8b3a2a';
  if (km >= 20) return '#c46b2c';
  return '#2e5a4c';
}
function weight(km) {
  return Math.max(1.6, Math.min(16, 1.2 + 3.4 * Math.log10(Math.max(km, 1))));
}
function curve(a, b) {
  const lat1 = a[0], lon1 = a[1], lat2 = b[0], lon2 = b[1];
  const mx = (lat1 + lat2) / 2, my = (lon1 + lon2) / 2;
  const dx = lon2 - lon1, dy = lat2 - lat1;
  const k = 0.16;
  const cx = mx + (-dy) * k, cy = my + dx * k;
  const pts = [];
  for (let t = 0; t <= 1.0001; t += 0.04) {
    const u = 1 - t;
    pts.push([
      u*u*lat1 + 2*u*t*cx + t*t*lat2,
      u*u*lon1 + 2*u*t*cy + t*t*lon2
    ]);
  }
  return pts;
}
function heading(p0, p1) {
  return Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
}
function arrowHead(pts, col, w) {
  const n = pts.length;
  const tip = pts[n - 1];
  const prev = pts[n - 4] || pts[n - 2];
  const ang = heading(prev, tip);
  const len = 0.12 + w * 0.018;
  const spread = 0.55;
  const left = [tip[0] - len * Math.cos(ang - spread), tip[1] - len * Math.sin(ang - spread)];
  const right = [tip[0] - len * Math.cos(ang + spread), tip[1] - len * Math.sin(ang + spread)];
  return L.polygon([left, tip, right], {
    color: col, weight: 1, fillColor: col, fillOpacity: 0.95, interactive: false
  });
}

function popup(h) {
  const mass = h.mass_t ? `${h.mass_t} t` : '—';
  const refs = (h.refs || []).join('; ');
  return `<h3>${h.site}</h3>
    <div><strong>From</strong> ${h.source}</div>
    <div><strong>Rock</strong> ${h.rock}</div>
    <div><strong>Distance</strong> ${h.km_used} km <span class="muted">(range ${h.km_min}–${h.km_max})</span></div>
    <div><strong>Mass</strong> ${mass}${h.mass_note ? ' · ' + h.mass_note : ''}</div>
    <div><strong>Mode</strong> ${h.mode}</div>
    <div><strong>Evidence</strong> ${h.evidence} · ${h.source_precision}</div>
    <div><strong>Method</strong> ${h.method}</div>
    <div class="muted">${refs}</div>
    <div><a href="gazetteer.html#${h.id}">Open gazetteer row</a></div>`;
}

function visible() {
  const minKm = Number(document.getElementById('minKm').value);
  const region = document.getElementById('region').value;
  const ev = document.getElementById('evidence').value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  return HAULS.filter(h =>
    h.km_used >= minKm &&
    (region === 'all' || h.region === region) &&
    (ev === 'all' || h.evidence === ev) &&
    (!q || [h.site, h.source, h.rock, h.region, h.id].join(' ').toLowerCase().includes(q))
  );
}

const objects = {};

function draw() {
  layer.clearLayers();
  Object.keys(objects).forEach(k => delete objects[k]);
  const rows = visible().slice().sort((a, b) => b.km_used - a.km_used);
  document.getElementById('stats').textContent =
    `${rows.length} haul${rows.length === 1 ? '' : 's'} · longest ${rows.reduce((m,h)=>Math.max(m,h.km_used),0)} km`;
  rows.forEach(h => {
    const from = [h.source_lat, h.source_lon];
    const to = [h.site_lat, h.site_lon];
    const col = colour(h.km_used);
    const pts = curve(from, to);
    const line = L.polyline(pts, {
      color: col, weight: weight(h.km_used), opacity: 0.82, lineCap: 'round'
    }).bindPopup(popup(h));
    line.addTo(layer);
    arrowHead(pts, col, weight(h.km_used)).addTo(layer);
    const dest = L.circleMarker(to, { radius: 6, color: '#1b241c', weight: 1, fillColor: col, fillOpacity: 0.95 })
      .bindPopup(popup(h)).addTo(layer);
    const src = L.circleMarker(from, { radius: 5, color: '#1b241c', weight: 1, fillColor: '#fffdf8', fillOpacity: 1 })
      .bindPopup(popup(h)).addTo(layer);
    objects[h.id] = { line, dest, src, from, to };
  });
  renderList(rows);
}

function renderList(rows) {
  const box = document.getElementById('gazetteer');
  box.innerHTML = rows.map(h => `
    <div class="g-item" data-id="${h.id}">
      <div class="g-km" style="color:${colour(h.km_used)}">${h.km_used}<br><span class="muted">km</span></div>
      <div>
        <span class="dot" style="background:${colour(h.km_used)}"></span><strong>${h.site}</strong>
        <div class="g-src">${h.source} · ${h.rock}</div>
        <div class="muted">${h.region} · ${h.evidence}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('.g-item').forEach(el => {
    el.addEventListener('click', () => focusHaul(el.dataset.id));
  });
}

function focusHaul(id) {
  const h = byId[id];
  const obj = objects[id];
  if (!h || !obj) return;
  history.replaceState(null, '', '#' + id);
  map.fitBounds(L.latLngBounds([obj.from, obj.to]).pad(0.45), { maxZoom: 10 });
  obj.dest.openPopup();
  document.querySelectorAll('.g-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
}

function toCsv(rows) {
  const cols = ['id','site','source','rock','km_used','km_min','km_max','mass_t','mode','evidence','region','refs'];
  const esc = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  return [cols.join(','), ...rows.map(r => cols.map(c => esc(c === 'refs' ? (r.refs||[]).join('; ') : r[c])).join(','))].join('\n');
}

fetch('data/hauls.json')
  .then(r => r.json())
  .then(j => {
    HAULS = j.hauls;
    HAULS.forEach(h => { byId[h.id] = h; });
    const regions = [...new Set(HAULS.map(h => h.region))].sort();
    const sel = document.getElementById('region');
    regions.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r; sel.appendChild(o);
    });
    draw();
    const b = L.latLngBounds(HAULS.flatMap(h => [[h.site_lat,h.site_lon],[h.source_lat,h.source_lon]]));
    map.fitBounds(b.pad(0.08));
    const hash = decodeURIComponent(location.hash.replace('#',''));
    if (hash && byId[hash]) setTimeout(() => focusHaul(hash), 400);
  });

document.getElementById('minKm').addEventListener('input', e => {
  document.getElementById('minLabel').textContent = e.target.value;
  draw();
});
document.getElementById('region').addEventListener('change', draw);
document.getElementById('evidence').addEventListener('change', draw);
document.getElementById('q').addEventListener('input', draw);
document.getElementById('fit').addEventListener('click', () => {
  const rows = visible();
  if (!rows.length) return;
  const b = L.latLngBounds(rows.flatMap(h => [[h.site_lat,h.site_lon],[h.source_lat,h.source_lon]]));
  map.fitBounds(b.pad(0.1));
});
document.getElementById('csv').addEventListener('click', () => {
  const blob = new Blob([toCsv(visible())], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'megalith-hauls.csv';
  a.click();
});
</script>
</body>
</html>
